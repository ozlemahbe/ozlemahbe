<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 405" role="img" aria-label="Cyber Kawaii GitHub profile banner: Welcome to my profile – Özlem AHBE, Computer Engineering Student, Flutter Developer and AI Explorer">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17112C"/><stop offset=".62" stop-color="#20173D"/><stop offset="1" stop-color="#17112C"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FF4CBD"/><stop offset="1" stop-color="#FF83E4"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00E6F0"/><stop offset="1" stop-color="#A57CFF"/></linearGradient>
    <radialGradient id="vapor"><stop stop-color="#FF4CBD" stop-opacity=".27"/><stop offset="1" stop-color="#FF4CBD" stop-opacity="0"/></radialGradient>
    <radialGradient id="aqua"><stop stop-color="#00E6F0" stop-opacity=".22"/><stop offset="1" stop-color="#00E6F0" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="dots" width="29" height="29" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#A57CFF" opacity=".19"/></pattern>
    <clipPath id="clip"><rect width="1200" height="405" rx="26"/></clipPath>
  </defs>
